<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка – Bootstrap Shop</title>
  <link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-dark">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Bootstrap Shop</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
        aria-controls="mainNavbar"
        aria-expanded="false"
        aria-label="Переключить навигацию"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="catalog.html">Каталог</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="order.html">Заявка</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="bg-dark text-light">
    <section class="container my-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
          <div class="border rounded shadow-lg bg-secondary bg-gradient bg-opacity-75">
            <div class="bg-primary text-white p-3 rounded-top">
              <h1 class="h4 mb-0">Форма заявки</h1>
            </div>
            <div class="p-4">
              <div class="alert alert-info bg-dark bg-opacity-50 border border-info text-info" role="alert">
                Заполните форму. Поля со звёздочкой являются обязательными.
              </div>

              <form>
                <div class="row g-3">
                  <div class="col-12 col-md-6">
                    <label for="order-name" class="form-label text-light">Имя *</label>
                    <input id="order-name" name="name" type="text" class="form-control" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-email" class="form-label text-light">E-mail *</label>
                    <input id="order-email" name="email" type="email" class="form-control" required>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-phone" class="form-label text-light">Телефон</label>
                    <div class="input-group">
                      <span class="input-group-text">+7</span>
                      <input
                        id="order-phone"
                        name="phone"
                        type="tel"
                        class="form-control"
                        placeholder="900 000-00-00"
                      >
                    </div>
                  </div>

                  <div class="col-12 col-md-6">
                    <label for="order-product" class="form-label text-light">Товар</label>
                    <select id="order-product" name="product" class="form-select">
                      <option selected>Выберите товар</option>
                      <option value="product-1">Товар 1</option>
                      <option value="product-2">Товар 2</option>
                      <option value="product-3">Товар 3</option>
                    </select>
                  </div>

                  <div class="col-12">
                    <label for="order-comment" class="form-label text-light">Комментарий</label>
                    <textarea
                      id="order-comment"
                      name="comment"
                      class="form-control"
                      rows="4"
                    ></textarea>
                  </div>

                  <div class="col-12">
                    <div class="form-check">
                      <input id="order-agree" class="form-check-input" type="checkbox" required>
                      <label class="form-check-label text-light" for="order-agree">
                        Я согласен на обработку данных *
                      </label>
                    </div>
                  </div>

                  <div class="col-12 d-flex gap-2">
                    <button class="btn btn-primary border border-light bg-dark bg-opacity-25 text-light shadow-lg" type="submit">Отправить заявку</button>
                    <button class="btn btn-primary border border-light bg-dark bg-opacity-25 text-light shadow-lg" type="reset">Очистить</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-12 col-md-6">
          <p class="mb-0">&copy; 2026 Bootstrap Shop. Учебный проект.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <a class="text-white text-decoration-none me-3" href="catalog.html">Каталог</a>
          <a class="text-white text-decoration-none" href="order.html">Заявка</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
